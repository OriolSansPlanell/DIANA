# Install once with:  pip install pre-commit && pre-commit install
#
# That installs two git hooks:
#   * on every commit  — strip notebook outputs, ruff, whitespace and file checks
#   * on every push    — the fast test suite (pytest -m "not slow"), so a broken
#                        commit is caught before it reaches GitHub
# Skip them in an emergency with --no-verify; CI runs the same checks anyway.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout          # never commit notebook outputs
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: check-case-conflict      # macOS / Windows file systems
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(txt|svg)$
      - id: end-of-file-fixer
        exclude: \.(txt|svg)$
      - id: trailing-whitespace
        exclude: \.(txt|svg)$
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast tests)
        entry: python -m pytest -m "not slow" -q -x -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
