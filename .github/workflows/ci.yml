name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and current: the package advertises >=3.9, so the floor is
        # tested rather than assumed.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check neutron_xray_sim tests

      - name: Test
        # The whole suite runs on the NumPy CPU path; ASTRA-only tests skip.
        run: pytest -q --cov=neutron_xray_sim --cov-report=term-missing

  import-check:
    name: import without optional extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Import and build one phantom
        # Guards against a stray top-level import of an optional dependency
        # (ASTRA, TomoPy, tifffile, NCrystal, PyQt5) creeping into the package.
        run: |
          python -c "
          import matplotlib; matplotlib.use('Agg')
          import neutron_xray_sim as nxs
          p = nxs.make_phantom('composite', N=16)
          print(nxs.__version__, p, len(nxs.MATERIALS), 'materials')
          "
