# Runs on every push to every branch and on every pull request, so each commit
# that reaches GitHub is linted, tested on Linux/macOS/Windows and packaged.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]          # tags are handled by release.yml
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"         # Mondays: catch breakage from new dependency releases

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - name: Ruff, notebook outputs, whitespace, large files, YAML/TOML
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Unit, integration and regression tests (CPU backends)
        run: pytest --durations=10

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Tests with coverage (fails below the threshold)
        run: pytest --cov --cov-report=xml --cov-report=term --cov-fail-under=80
      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  oldest-deps:
    name: Oldest supported dependencies (Python 3.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install the lower bounds declared in pyproject.toml
        run: |
          pip install uv
          uv pip install --system --resolution lowest-direct -e .
          uv pip install --system pytest pytest-cov tifffile
          pip list
      - run: pytest

  tutorials:
    name: Tutorials execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,notebooks]"
      - name: Execute every tutorial notebook top to bottom
        run: pytest --nbmake --nbmake-timeout=900 tutorials/

  package:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata renders on PyPI
        run: twine check --strict dist/*
      - name: Install the wheel in a clean environment and smoke-test it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/python - <<'EOF'
          import neutron_xray_sim as nxs
          # Data files must ship in the wheel (they are not Python modules).
          print(nxs.__version__, nxs.MATERIALS["iron"].mu_x_at(80.0))
          ph = nxs.make_phantom("composite", N=16)
          x, n = nxs.make_sinogram_pair(ph, n_angles=8, use_astra=False, verbose=False)
          assert x["sino_lam"].shape == (8, 16, 16)
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # One stable check name to require in branch protection, whatever the matrix.
  all-checks:
    name: All checks passed
    if: always()
    needs: [lint, tests, coverage, oldest-deps, tutorials, package]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed."
