name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.5" nbstripout
      - name: Ruff (pyflakes-level checks)
        run: ruff check .
      - name: Notebooks are committed without outputs
        run: |
          for nb in notebooks/*.ipynb tutorials/*.ipynb; do
            nbstripout --verify "$nb" || { echo "::error file=$nb::run 'pre-commit install' or 'nbstripout $nb'"; exit 1; }
          done

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit + integration tests (CPU backends)
        run: pytest --cov=neutron_xray_sim --cov-report=term-missing

  tutorials:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,notebooks]"
      - name: Execute every tutorial notebook
        run: pytest --nbmake --nbmake-timeout=900 tutorials/
