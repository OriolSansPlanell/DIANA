[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neutron_xray_sim"
dynamic = ["version"]
description = "DIANA: dual-modality neutron/X-ray CT simulation and bimodal histogram analysis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Oriol Sans-Planell" },
    { name = "Shahabeddin Dayani" },
]
keywords = ["neutron imaging", "X-ray CT", "tomography", "simulation",
            "bimodal histogram", "multimodal imaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pandas>=1.5",
]

[project.optional-dependencies]
gpu       = ["astra-toolbox>=1.9"]            # usually installed with conda, see docs/installation.md
gridrec   = ["tomopy>=1.14"]
bragg     = ["ncrystal>=3.6"]
tiff      = ["tifffile"]
gui       = ["PyQt5"]
notebooks = ["jupyterlab", "ipykernel", "tifffile"]
dev       = ["pytest>=7", "pytest-cov", "tifffile", "ruff>=0.6", "nbmake", "nbstripout",
             "pre-commit"]

[project.scripts]
diana-gui = "neutron_xray_sim.gui.app:main"

[project.urls]
Repository = "https://github.com/OriolSansPlanell/DIANA"
Documentation = "https://github.com/OriolSansPlanell/DIANA/blob/main/docs/index.md"
Changelog = "https://github.com/OriolSansPlanell/DIANA/blob/main/CHANGELOG.md"
Issues = "https://github.com/OriolSansPlanell/DIANA/issues"
Preprint = "https://doi.org/10.21203/rs.3.rs-9724333/v1"

[tool.setuptools.dynamic]
version = { attr = "neutron_xray_sim._version.__version__" }

[tool.setuptools.packages.find]
include = ["neutron_xray_sim*"]

[tool.setuptools.package-data]
"neutron_xray_sim.physics" = ["data/xray/*.txt"]

# ── Testing ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Known bugs are recorded as xfail tests; strict means that fixing one makes the
# test fail until its xfail marker is removed, so the record stays accurate.
xfail_strict = true
markers = [
    "slow: end-to-end tests that run the full pipeline (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore:ASTRA not available:UserWarning",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["neutron_xray_sim"]
omit = ["neutron_xray_sim/gui/*"]   # Qt desktop app: needs a display, tested by hand

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ── Linting ───────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["notebooks", "*.ipynb"]

[tool.ruff.lint]
# Pyflakes (undefined names, unused imports/variables), syntax errors and
# flake8-bugbear (likely bugs: mutable defaults, unused loop variables, warnings
# without a stacklevel, ...). Formatting rules are deliberately not enforced, to
# keep diffs of existing code small.
select = ["F", "E9", "B"]
ignore = ["B905"]   # zip(strict=...) needs Python 3.10

[tool.ruff.lint.per-file-ignores]
"neutron_xray_sim/__init__.py" = ["E402"]
"neutron_xray_sim/gui/app.py" = ["F401", "F841"]
