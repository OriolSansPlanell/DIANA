[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "neutron_xray_sim"
version         = "1.2.0"
description     = "Dual-modality neutron/X-ray CT simulation and bimodal histogram analysis"
readme          = "README.md"
requires-python = ">=3.9"
license         = {text = "MIT"}
authors = [
    {name = "Oriol Sans-Planell"},
    {name = "Shahabeddin Dayani"},
]
maintainers = [
    {name = "Helmholtz-Zentrum Berlin tomography group"},
]
keywords = ["tomography", "neutron imaging", "X-ray CT", "bimodal histogram", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
gpu     = ["astra-toolbox>=1.9"]
gridrec = ["tomopy>=1.14"]
tiff    = ["tifffile>=2023.1"]
bragg   = ["ncrystal>=3.8"]
gui     = ["PyQt5>=5.15"]
docs    = ["sphinx>=7", "sphinx-rtd-theme", "myst-parser"]
dev     = ["pytest>=7", "pytest-cov", "ruff>=0.4", "jupyter", "nbstripout"]

[project.urls]
Homepage      = "https://github.com/OriolSansPlanell/DIANA"
Documentation = "https://github.com/OriolSansPlanell/DIANA/blob/main/docs/index.md"
Issues        = "https://github.com/OriolSansPlanell/DIANA/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["neutron_xray_sim*"]

[tool.setuptools.package-data]
neutron_xray_sim = ["lib/xray_data/*.txt"]

[tool.pytest.ini_options]
testpaths       = ["tests"]
addopts         = "-q --strict-markers"
filterwarnings  = ["ignore::DeprecationWarning"]
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "gpu: requires an ASTRA-capable CUDA GPU",
]

[tool.ruff]
line-length    = 100
target-version = "py39"
exclude        = ["notebooks", "results", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are tolerated in physics tables and docstrings
    "E741",  # `l`, `I` are conventional symbols here (path length, intensity)
    "B008",
    # typing.Tuple / Optional / Union are kept throughout for the 3.9 floor;
    # rewriting them to PEP 604 syntax would be pure churn.
    "UP006", "UP007", "UP035", "UP038", "UP045",
]

[tool.ruff.lint.per-file-ignores]
"neutron_xray_sim/__init__.py" = ["F401"]  # re-exports are the point
"tests/*"                      = ["B011"]
